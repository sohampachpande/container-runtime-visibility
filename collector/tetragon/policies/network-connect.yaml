apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: runtime-network-connect
spec:
  kprobes:
    - call: tcp_connect
      syscall: false
      args:
        - index: 0
          type: sock
      selectors:
        - matchBinaries:
            - operator: In
              values:
                - /nodejs/bin/node
          matchActions:
            - action: Post
